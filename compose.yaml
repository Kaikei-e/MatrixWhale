services:
  proxy:
    build:
      context: ./proxy
    ports:
      - "8180:80"
      - "9190:9090"
    tty: true
    restart: always
    networks:
      matrix_network:
        ipv4_address: 10.254.100.5

  web:
    build:
      context: ./web
    ports:
      - "4174:4173"
    environment:
      - ENV_VAR=test_value
    volumes:
      - ./web:/web
    tty: true
    restart: always
    networks:
      matrix_network:
        ipv4_address: 10.254.100.10

  federation_orchestrator:
    build:
      context: ./federation_orchestrator
    ports:
      - "5000:5000"
    volumes:
      - ./federation_orchestrator:/app/federation_orchestrator
    tty: true
    restart: always
    networks:
      matrix_network:
        ipv4_address: 10.254.100.20
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  matrix_whale:
    build:
      context: ./matrix_whale
    environment:
      - ENV_VAR=test_value
    ports:
      - "8081:8080"
      - "6000:6000"
    tty: true
    restart: always
    volumes:
      - ./matrix_whale:/matrix_whale
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      matrix_network:
        ipv4_address: 10.254.100.30
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rss_feed_adapter:
    build:
      context: ./rss_feed_adapter
    ports:
      - "8086:8085"
    volumes:
      - ./rss_feed_adapter:/app/rss_feed_adapter
    tty: true
    restart: always
    networks:
      matrix_network:
        ipv4_address: 10.254.100.41
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8085/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  noaa_adapter:
    build:
      context: .
      dockerfile: noaa_adapter/Dockerfile
    environment:
      - ENV_VAR=test_value
      - NOAA_CONTACT_EMAIL=${NOAA_CONTACT_EMAIL}
    tty: true
    restart: always
    volumes:
      - ./noaa_adapter/app:/app
    depends_on:
      - matrix_whale
    networks:
      matrix_network:
        ipv4_address: 10.254.100.40

  usgs_adapter:
    build:
      context: .
      dockerfile: usgs_adapter/Dockerfile
    environment:
      USGS_CONTACT_EMAIL: ${USGS_CONTACT_EMAIL:-}
      USGS_MIN_MAG: ${USGS_MIN_MAG:-}
      MATRIX_WHALE_URL: http://matrix_whale:6000/api/v1
    tty: true
    restart: always
    volumes:
      - ./usgs_adapter/app:/app
    depends_on:
      - matrix_whale
    networks:
      matrix_network:
        ipv4_address: 10.254.100.42

  emsc_adapter:
    build:
      context: .
      dockerfile: emsc_adapter/Dockerfile
    environment:
      EMSC_CONTACT_EMAIL: ${EMSC_CONTACT_EMAIL:-}
      MATRIX_WHALE_URL: http://matrix_whale:6000/api/v1
    tty: true
    restart: always
    volumes:
      - ./emsc_adapter/app:/app
    depends_on:
      - matrix_whale
    networks:
      matrix_network:
        ipv4_address: 10.254.100.43

  db:
    build:
      context: ./db
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5440:5432"
    tty: true
    restart: always
    volumes:
      - ./db/data18:/var/lib/postgresql
    networks:
      matrix_network:
        ipv4_address: 10.254.100.50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: arigaio/atlas:1.3.3-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - migrate
      - apply
      - --url
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - --dir
      - file:///migrations
    networks:
      matrix_network:
        ipv4_address: 10.254.100.51

networks:
  matrix_network:
    ipam:
      driver: default
      config:
        - subnet: 10.254.100.0/24
