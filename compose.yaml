services:
  proxy:
    build:
      context: ./proxy
    ports:
      - "8180:8080"
      - "9190:9090"
    restart: always
    healthcheck:
      test: ["CMD", "/usr/local/bin/plecto", "healthz", "/etc/plecto/plecto.toml"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      matrix_network:
        ipv4_address: 10.254.100.5

  web:
    build:
      context: ./web
    ports:
      - "4174:4173"
    environment:
      - ENV_VAR=test_value
    volumes:
      - ./web:/web
    tty: true
    restart: always
    networks:
      matrix_network:
        ipv4_address: 10.254.100.10

  federation_orchestrator:
    build:
      context: ./federation_orchestrator
    ports:
      - "5000:5000"
    volumes:
      - ./federation_orchestrator:/app/federation_orchestrator
    tty: true
    restart: always
    networks:
      matrix_network:
        ipv4_address: 10.254.100.20
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  matrix_whale:
    build:
      context: ./matrix_whale
    environment:
      - ENV_VAR=test_value
    ports:
      - "8081:8080"
      - "6000:6000"
    tty: true
    restart: always
    volumes:
      - ./matrix_whale:/matrix_whale
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      matrix_network:
        ipv4_address: 10.254.100.30
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rss_feed_adapter:
    build:
      context: ./rss_feed_adapter
    ports:
      - "8086:8085"
    volumes:
      - ./rss_feed_adapter:/app/rss_feed_adapter
    tty: true
    restart: always
    networks:
      matrix_network:
        ipv4_address: 10.254.100.41
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8085/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  noaa_adapter:
    build:
      context: .
      dockerfile: noaa_adapter/Dockerfile
    environment:
      - ENV_VAR=test_value
      - NOAA_CONTACT_EMAIL=${NOAA_CONTACT_EMAIL}
    tty: true
    restart: always
    volumes:
      - ./noaa_adapter/app:/app
    depends_on:
      - matrix_whale
    networks:
      matrix_network:
        ipv4_address: 10.254.100.40

  usgs_adapter:
    build:
      context: .
      dockerfile: usgs_adapter/Dockerfile
    environment:
      USGS_CONTACT_EMAIL: ${USGS_CONTACT_EMAIL:-}
      USGS_MIN_MAG: ${USGS_MIN_MAG:-}
      MATRIX_WHALE_URL: http://matrix_whale:6000/api/v1
    tty: true
    restart: always
    volumes:
      - ./usgs_adapter/app:/app
    depends_on:
      - matrix_whale
    networks:
      matrix_network:
        ipv4_address: 10.254.100.42

  emsc_adapter:
    build:
      context: .
      dockerfile: emsc_adapter/Dockerfile
    environment:
      EMSC_CONTACT_EMAIL: ${EMSC_CONTACT_EMAIL:-}
      MATRIX_WHALE_URL: http://matrix_whale:6000/api/v1
    tty: true
    restart: always
    volumes:
      - ./emsc_adapter/app:/app
    depends_on:
      - matrix_whale
    networks:
      matrix_network:
        ipv4_address: 10.254.100.43

  gdacs_adapter:
    build:
      context: .
      dockerfile: gdacs_adapter/Dockerfile
    environment:
      GDACS_CONTACT_EMAIL: ${GDACS_CONTACT_EMAIL:-}
      MATRIX_WHALE_URL: http://matrix_whale:6000/api/v1
      GDACS_BACKFILL_DAYS: 14
      GDACS_POLL_INTERVAL: 5m
      GDACS_MIN_REQUEST_INTERVAL: 10s
    tty: true
    restart: always
    volumes:
      - ./gdacs_adapter/app:/app
    depends_on:
      - matrix_whale
    networks:
      matrix_network:
        ipv4_address: 10.254.100.44

  cap_adapter:
    build:
      context: .
      dockerfile: cap_adapter/Dockerfile
    environment:
      MATRIX_WHALE_URL: http://matrix_whale:6000/api/v1
      CAP_CONTACT_EMAIL: ${CAP_CONTACT_EMAIL:-}
      CAP_RAA_URL: https://alertingauthority.wmo.int/rss.xml
      CAP_POLL_INTERVAL: 5m
      CAP_REGISTRY_INTERVAL: 24h
      CAP_HOST_MIN_INTERVAL: 2s
      CAP_MAX_PARALLEL_HOSTS: 8
    tty: true
    restart: always
    volumes:
      - ./cap_adapter/app:/app
    depends_on:
      - matrix_whale
    networks:
      matrix_network:
        ipv4_address: 10.254.100.45

  jma_adapter:
    build:
      context: .
      dockerfile: jma_adapter/Dockerfile
    environment:
      MATRIX_WHALE_URL: http://matrix_whale:6000/api/v1
      JMA_CONTACT_EMAIL: ${JMA_CONTACT_EMAIL:-}
      JMA_STATE_DIR: /var/lib/jma
      JMA_POLL_INTERVAL: 1m
      JMA_LONG_POLL_INTERVAL: 1h
      JMA_REQUEST_INTERVAL: 1s
      JMA_DAILY_BYTE_LIMIT: 1073741824
      JMA_MAX_ITEM_BYTES: 8388608
      JMA_FEEDS: https://www.data.jma.go.jp/developer/xml/feed/eqvol.xml,https://www.data.jma.go.jp/developer/xml/feed/extra.xml
      JMA_LONG_FEEDS: https://www.data.jma.go.jp/developer/xml/feed/eqvol_l.xml,https://www.data.jma.go.jp/developer/xml/feed/extra_l.xml
    tty: true
    restart: always
    volumes:
      - jma_state:/var/lib/jma
      - ./jma_adapter/app:/app
    depends_on:
      - matrix_whale
    networks:
      matrix_network:
        ipv4_address: 10.254.100.46

  wis2_adapter:
    build:
      context: .
      dockerfile: wis2_adapter/Dockerfile
    environment:
      MATRIX_WHALE_URL: http://matrix_whale:6000/api/v1
      WIS2_BROKERS: mqtts://globalbroker.meteo.fr:8883,mqtts://gb.wis.cma.cn:8883,mqtts://wis2globalbroker.nws.noaa.gov:8883,mqtts://globalbroker.inmet.gov.br:8883
      WIS2_USERNAME: everyone
      WIS2_PASSWORD: everyone
      WIS2_TOPICS: cache/a/wis2/+/data/core/weather/advisories-warnings/#,cache/a/wis2/+/data/core/weather/prediction/forecast/+/deterministic/trajectory/#,cache/a/wis2/+/data/core/weather/surface-based-observations/synop/#
      WIS2_CONTACT_EMAIL: ${WIS2_CONTACT_EMAIL:-}
      WIS2_MAX_DOWNLOAD_BYTES: 5242880
      WIS2_DOWNLOAD_CONCURRENCY: 8
      WIS2_HEALTH_INTERVAL: 60s
    tty: true
    restart: always
    volumes:
      - ./wis2_adapter/app:/app
    depends_on:
      - matrix_whale
    networks:
      matrix_network:
        ipv4_address: 10.254.100.47



  db:
    build:
      context: ./db
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5440:5432"
    tty: true
    restart: always
    volumes:
      - ./db/data18:/var/lib/postgresql
    networks:
      matrix_network:
        ipv4_address: 10.254.100.50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: arigaio/atlas:1.3.3-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - migrate
      - apply
      - --url
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - --dir
      - file:///migrations
    networks:
      matrix_network:
        ipv4_address: 10.254.100.51

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9290:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: always
    networks:
      matrix_network:
        ipv4_address: 10.254.100.60

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: always
    depends_on:
      - prometheus
    networks:
      matrix_network:
        ipv4_address: 10.254.100.61

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      matrix_network:
        ipv4_address: 10.254.100.62

networks:
  matrix_network:
    ipam:
      driver: default
      config:
        - subnet: 10.254.100.0/24

volumes:
  prometheus_data:
  grafana_data:
  jma_state:
