global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: matrix_whale
    metrics_path: /metrics
    static_configs:
      - targets: ["matrix_whale:6000"]

  - job_name: usgs_adapter
    metrics_path: /metrics
    static_configs:
      - targets: ["usgs_adapter:2112"]

  - job_name: emsc_adapter
    metrics_path: /metrics
    static_configs:
      - targets: ["emsc_adapter:2112"]

  - job_name: gdacs_adapter
    metrics_path: /metrics
    static_configs:
      - targets: ["gdacs_adapter:2112"]

  - job_name: cap_adapter
    metrics_path: /metrics
    static_configs:
      - targets: ["cap_adapter:2112"]

  - job_name: noaa_adapter
    metrics_path: /metrics
    static_configs:
      - targets: ["noaa_adapter:2112"]

  - job_name: proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["proxy:9090"]

  - job_name: postgres_exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
